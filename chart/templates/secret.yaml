apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tlg.fullname" . }}
  labels:
    {{- include "tlg.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ include "tlg.secretValue" (dict "ctx" . "key" "master-key" "value" .Values.gateway.masterKey) | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ include "tlg.secretValue" (dict "ctx" . "key" "postgres-password" "value" .Values.postgres.password) | quote }}
  {{- else }}
  database-url: {{ required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if and .Values.openai.apiKey (not .Values.openai.existingSecret) }}
  openai-api-key: {{ .Values.openai.apiKey | quote }}
  {{- end }}
